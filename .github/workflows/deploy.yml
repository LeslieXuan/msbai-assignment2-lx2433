name: nyc311-deploy-dashboard

# Part 3: deploy the Streamlit dashboard to Cloud Run (public) via WIF.
# Source deploy (Cloud Build) from ./dashboard. The service runs AS the pipeline
# SA so it can query BigQuery; --allow-unauthenticated makes it public.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Cloud Run region"
        required: false
        default: "us-central1"

permissions:
  id-token: write
  contents: read

env:
  GCP_PROJECT: msbai-dwd-lx2433
  SERVICE: nyc311-dashboard
  SA: claude-agent@msbai-dwd-lx2433.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/526972029302/locations/global/workloadIdentityPools/github-actions-pool/providers/github-oidc
          service_account: claude-agent@msbai-dwd-lx2433.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source dashboard \
            --project "$GCP_PROJECT" \
            --region "${{ github.event.inputs.region }}" \
            --service-account "$SA" \
            --build-service-account "projects/$GCP_PROJECT/serviceAccounts/$SA" \
            --set-env-vars "GCP_PROJECT=$GCP_PROJECT,BQ_LOCATION=US" \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --quiet

      - name: Show URL
        run: |
          gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT" --region "${{ github.event.inputs.region }}" \
            --format 'value(status.url)'
